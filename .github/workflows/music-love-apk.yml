name: Build MUSIC LOVE APK
on:
  push:
    branches: [ main ]
    paths: [ 'musiclove/**', 'settings.gradle.kts', '.github/workflows/music-love-apk.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and verify MUSIC LOVE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run unit tests
        run: gradle --no-daemon :musiclove:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :musiclove:assembleDebug
      - name: Verify package and APK signature
        run: |
          APK="musiclove/build/outputs/apk/debug/musiclove-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.musiclove.player'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MUSIC-LOVE-debug-apk
          path: musiclove/build/outputs/apk/debug/musiclove-debug.apk
          if-no-files-found: error
          retention-days: 30
