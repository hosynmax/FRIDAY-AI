name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FRIDAY-AI-expanded-source(1).zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract and build Android project
        run: |
          test -f 'FRIDAY-AI-expanded-source(1).zip'
          unzip -q 'FRIDAY-AI-expanded-source(1).zip'
          cd FRIDAY-AI
          gradle --no-daemon assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-AI-debug-apk
          path: FRIDAY-AI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
