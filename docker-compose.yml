services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Keep Ollama private on the Docker network; do not publish port 11434.
  friday-api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      PORT: 8080
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-120000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "8080:8080"
volumes:
  ollama_data:
